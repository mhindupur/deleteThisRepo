[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "accusec"
version = "0.1.0"
description = "AccuSec Enterprise AI OS — local Hybrid Cloud / AWS slice"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "pymysql>=1.1", "fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
aws = ["boto3>=1.34"]

[project.scripts]
accusec = "accusec.interfaces.api.cli:main"

[tool.setuptools]
packages = [
  "accusec",
  "accusec.shared",
  "accusec.shared.domain",
  "accusec.security",
  "accusec.platform_services",
  "accusec.platform_services.authorization",
  "accusec.platform_services.audit",
  "accusec.platform_services.secrets",
  "accusec.platform_services.context",
  "accusec.memory",
  "accusec.memory.entity",
  "accusec.memory.topology",
  "accusec.memory.catalog",
  "accusec.orchestration",
  "accusec.orchestration.orchestrator",
  "accusec.orchestration.planner",
  "accusec.orchestration.hitl",
  "accusec.orchestration.workflow",
  "accusec.agents",
  "accusec.agents.harness",
  "accusec.agents.skills_aws",
  "accusec.agents.aws_pack",
  "accusec.integration",
  "accusec.integration.aws_connector",
  "accusec.integration.aws_mcp",
  "accusec.integration.collectors",
  "accusec.data",
  "accusec.data.operational_db",
  "accusec.ai",
  "accusec.ai.gateway",
  "accusec.interfaces",
  "accusec.interfaces.api",
]

[tool.setuptools.package-dir]
"accusec" = "shared/src/accusec"
"accusec.shared.domain" = "shared/domain/src"
"accusec.security" = "security/rbac-abac/src"
"accusec.platform_services.authorization" = "platform-services/authorization/src"
"accusec.platform_services.audit" = "platform-services/audit/src"
"accusec.platform_services.secrets" = "platform-services/secrets/src"
"accusec.platform_services.context" = "platform-services/context/src"
"accusec.memory.entity" = "memory/entity/src"
"accusec.memory.topology" = "memory/topology/src"
"accusec.memory.catalog" = "memory/operation-catalog/src"
"accusec.orchestration.orchestrator" = "orchestration/agent-orchestrator/src"
"accusec.orchestration.planner" = "orchestration/planner/src"
"accusec.orchestration.hitl" = "orchestration/human-in-the-loop/src"
"accusec.orchestration.workflow" = "orchestration/workflow-engine/src"
"accusec.agents.harness" = "agents/skill-harness/src"
"accusec.agents.skills_aws" = "agents/skills/aws/src"
"accusec.agents.aws_pack" = "agents/enterprise-ai-engineers/hybrid-cloud/aws/src"
"accusec.integration.aws_connector" = "integration/connectors/hybrid-cloud/aws/src"
"accusec.integration.aws_mcp" = "integration/mcp-servers/aws/src"
"accusec.integration.collectors" = "integration/collectors/hybrid-cloud/src"
"accusec.data.operational_db" = "data/operational-db/src"
"accusec.ai.gateway" = "ai/gateway/src"
"accusec.interfaces.api" = "interfaces/api/src"

[tool.pytest.ini_options]
testpaths = [
  "shared/domain/tests",
  "platform-services/authorization/tests",
  "platform-services/context/tests",
  "orchestration/agent-orchestrator/tests",
  "orchestration/planner/tests",
  "integration/connectors/hybrid-cloud/aws/tests",
  "integration/collectors/hybrid-cloud/tests",
  "platform-services/secrets/tests",
  "agents/skill-harness/tests",
  "interfaces/api/tests",
]
pythonpath = ["."]
